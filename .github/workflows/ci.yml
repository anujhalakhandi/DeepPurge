name: ci
# Every push and PR: lint, cleaner tests (mksh, dash, busybox ash), WebUI tests, and a test zip.
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          bash -n deeppurge.sh
          for f in module/*.sh; do sh -n "$f"; done
      - name: ShellCheck (module, POSIX sh)
        run: shellcheck -S warning -s sh module/*.sh
      - name: ShellCheck (Termux script, deprecated)
        run: shellcheck -S warning -e SC2034,SC2012,SC2155,SC2059,SC2016 deeppurge.sh

  cleaner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mksh busybox
      - name: Cleaner tests (stubbed Android commands)
        run: sudo bash tests/cleaner.sh

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: WebUI tests (preview data)
        run: node tests/webui.cjs

  build:
    runs-on: ubuntu-latest
    needs: [lint, cleaner, webui]
    steps:
      - uses: actions/checkout@v4
      - run: tools/build-module.sh
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: DeepPurge-module-test
          path: dist/DeepPurge-v*.zip
