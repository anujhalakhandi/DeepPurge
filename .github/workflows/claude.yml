name: claude
# Write "@claude <what to do>" in an issue, an issue comment, or a PR comment / review.
# Claude works in GitHub Actions, then pushes a branch / PR for you to review.
# Needs ONE repository secret (Settings → Secrets and variables → Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  (from `claude setup-token`, uses your Claude plan)
#   or ANTHROPIC_API_KEY     (pay per use)
# Only the repository owner can trigger it.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.repository_owner) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.repository_owner) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.user.login == github.repository_owner) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Sonnet and a turn cap keep each run small. CLAUDE.md is read automatically.
          claude_args: --model claude-sonnet-5-5 --max-turns 25
