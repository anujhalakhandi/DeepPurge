name: release
# Makes a GitHub release when the version in module/module.prop changes on main
# (or when run by hand from the Actions tab). Skips if that tag already exists.
on:
  push:
    branches: [main]
    paths: ['module/**', CHANGELOG.md, deeppurge.sh, tools/build-module.sh]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: v
        run: |
          ver=$(sed -n 's/^version=v//p' module/module.prop)
          [ -n "$ver" ] || { echo "version= not found in module/module.prop"; exit 1; }
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "v$ver already released, nothing to do"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Check scripts
        if: steps.v.outputs.skip != '1'
        run: |
          shellcheck -S warning -s sh module/*.sh
          bash -n deeppurge.sh
          shellcheck -S warning -e SC2034,SC2012,SC2155,SC2059,SC2016 deeppurge.sh
      - name: Build
        if: steps.v.outputs.skip != '1'
        run: |
          ver=${{ steps.v.outputs.ver }}
          tools/build-module.sh                       # dist/DeepPurge-v$ver.zip + dist/update.json
          cp deeppurge.sh dist/deeppurge.sh           # deprecated Termux script
          (cd dist && sha256sum deeppurge.sh > deeppurge.sh.sha256)
          awk -v v="$ver" '$0=="## "v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No '## $ver' section in CHANGELOG.md"; exit 1; }
          tver=$(sed -n 's/^VERSION="\(.*\)"/\1/p' deeppurge.sh | head -n 1)
          cat >> notes.md <<NOTES

          ### Install
          Install \`DeepPurge-v$ver.zip\` in your root manager (KernelSU / ReSukiSU), reboot, then open the module's WebUI.

          The Termux script (\`deeppurge.sh\`, v$tver) is deprecated and only attached for existing users. It is separate from the module.
          NOTES
          sed -i 's/^          //' notes.md
      - name: Publish release
        if: steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=${{ steps.v.outputs.ver }}
          gh release create "v$ver" "dist/DeepPurge-v$ver.zip" dist/update.json dist/deeppurge.sh dist/deeppurge.sh.sha256 \
            --target "$GITHUB_SHA" --title "DeepPurge $ver" --notes-file notes.md --latest
